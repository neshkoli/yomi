name: Nehardea
options:
  bundleIdPrefix: com.nehardea
  deploymentTarget:
    iOS: "18.0"
    macOS: "13.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

targets:
  Nehardea:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - ".gitignore"
          - ".git"
          - "DerivedData"
          - "Info.plist"
          - "Views"
          - "Models"
          - "sources"
          - "build"
          - "*.xcodeproj"
          - "icon.png"
          - "yomi.png"
      - path: Views
      - path: Models
      - path: sources
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nehardea
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nehardea.viewer
      TARGETED_DEVICE_FAMILY: "2" # iPad only
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NehardeaMac:
    name: "Nehardea (macOS)"
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - ".gitignore"
          - ".git"
          - "DerivedData"
          - "Info.plist"
          - "Views"
          - "Models"
          - "sources"
          - "build"
          - "*.xcodeproj"
          - "icon.png"
          - "yomi.png"
      - path: Views
      - path: Models
      - path: sources
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nehardea
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      PRODUCT_NAME: Nehardea
      PRODUCT_BUNDLE_IDENTIFIER: com.nehardea.viewer.mac
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: Info.plist

schemes:
  Nehardea:
    build:
      targets:
        Nehardea: all
    run:
      config: Debug
      destination:
        platform: iOS Simulator
        name: iPad Pro 11-inch (M4)
    archive:
      config: Release
  Nehardea (macOS):
    build:
      targets:
        Nehardea (macOS): all
    run:
      config: Debug
      destination:
        platform: macOS
    archive:
      config: Release
